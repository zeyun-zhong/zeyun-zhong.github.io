- title: Experience
  type: time_table
  contents:
    - title: Research Assistant
      institution: IES, KIT & Fraunhofer IOSB, Karlsruhe, Germany
      year: Nov. 2021 - present
      description:
        - Proposed E²-TTT to efficiently learn long context beyond the fixed-window constraints of transformer models, sustaining >90% passkey-retrieval accuracy at 8× the training context.
        - Developed FlowNar, an efficient streaming video narration framework that dynamically manages the visual context, supporting 10× longer videos at 3× higher throughput than prior online LMMs.
        - Designed several novel action anticipation architectures achieving superior performance on large-scale benchmarks, including Epic-Kitchens and Ego4D.
        - Authored a comprehensive survey of 90+ deep learning action anticipation methods, introducing a taxonomy by contribution and consolidating datasets, metrics, and future directions.
        - "KIMoS project: led grant acquisition (€180K) for real-time assembly assistance, securing three industrial partners, and represented Fraunhofer IOSB at Hannover Messe 2026."
        - "JuBot project: built and deployed a multimodal action recognition system that identifies multiple people's actions in real time on the KIT ARMAR humanoid robot."
    - title: Master Thesis & Research Assistant
      institution: IPI, Leibniz University Hannover, Hannover, Germany
      year: Oct. 2020 - Sep. 2021
      description:
